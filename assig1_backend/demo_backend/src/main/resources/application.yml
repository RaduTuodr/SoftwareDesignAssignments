spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/assig
    username: postgres
    password: postgres
  sql:
    init:
      platform: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: false
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
springdoc:
  api-docs:
    path: /api-docs
